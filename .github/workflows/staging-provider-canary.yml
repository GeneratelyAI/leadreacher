name: Staging provider canary

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/staging-provider-canary.yml"
      - "apps/api/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate against the staging providers
        required: false
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  group: staging-provider-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      # The shared provider check imports the normal API configuration. These
      # are inert parser values for dependencies it does not contact.
      PORT: "3001"
      NODE_ENV: test
      RUNTIME_ROLE: api
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leadreacher
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leadreacher
      UPSTASH_REDIS_URL: redis://localhost:6379
      UPSTASH_REDIS_TOKEN: canary-placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: canary-anon-key
      SUPABASE_SERVICE_ROLE_KEY: canary-service-role-key
      GROQ_API_KEY: canary-groq-key
      APP_URL: https://staging.example.invalid
      CORS_ORIGIN: https://staging.example.invalid
      STRIPE_MOCK_MODE: "false"
      VIDEO_MOCK_MODE: "false"
      STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
      # The canary only retrieves prices; it never verifies webhook signatures.
      # Keep webhook signing material out of this read-only workflow.
      STRIPE_WEBHOOK_SECRET: canary-webhook-placeholder
      STRIPE_PRICE_PERSONALIZED_OUTREACH: ${{ secrets.STAGING_STRIPE_PRICE_PERSONALIZED_OUTREACH }}
      STRIPE_PRICE_AI_VIDEO_AD: ${{ secrets.STAGING_STRIPE_PRICE_AI_VIDEO_AD }}
      STRIPE_PRICE_UPLOADED_VIDEO: ${{ secrets.STAGING_STRIPE_PRICE_UPLOADED_VIDEO }}
      STRIPE_PRICE_VIDEO_ADDON: ${{ secrets.STAGING_STRIPE_PRICE_VIDEO_ADDON }}
      UNIPILE_DSN: ${{ secrets.STAGING_UNIPILE_DSN }}
      UNIPILE_API_KEY: ${{ secrets.STAGING_UNIPILE_API_KEY }}
      # Required by the API configuration parser but not used by account-list
      # verification. The real staging service holds the signing secret.
      UNIPILE_WEBHOOK_SECRET: canary-webhook-placeholder
      R2_PREFLIGHT_VIDEO_URL: ${{ secrets.STAGING_R2_PREFLIGHT_VIDEO_URL }}
      APIFY_API_KEY: ${{ secrets.STAGING_APIFY_API_KEY }}
      # pnpm runs package scripts from apps/api. Use an absolute workspace path
      # so the script and the root-level artifact upload agree on the evidence.
      PROVIDER_CANARY_REPORT_PATH: ${{ github.workspace }}/artifacts/staging-provider-canary.json
    steps:
      - uses: actions/checkout@v4
        with:
          # Start from the protected staging branch before examining a manual
          # ref. This workflow receives provider credentials, so it must never
          # execute an arbitrary ref supplied to workflow_dispatch.
          ref: develop
          fetch-depth: 0
      - name: Verify staging candidate belongs to develop
        id: candidate
        shell: bash
        env:
          CANDIDATE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
        run: |
          candidate="$(git rev-parse "${CANDIDATE_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$candidate" origin/develop; then
            echo "Staging canary candidates must be commits reachable from develop." >&2
            exit 1
          fi
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          # Scheduled workflows validate develop; manual runs may select an
          # earlier develop commit, never an untrusted branch or PR ref.
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 1

      - name: Verify staging canary configuration
        id: configuration
        shell: bash
        run: |
          required=(
            STAGING_STRIPE_SECRET_KEY
            STAGING_STRIPE_PRICE_PERSONALIZED_OUTREACH
            STAGING_STRIPE_PRICE_AI_VIDEO_AD
            STAGING_STRIPE_PRICE_UPLOADED_VIDEO
            STAGING_STRIPE_PRICE_VIDEO_ADDON
            STAGING_UNIPILE_DSN
            STAGING_UNIPILE_API_KEY
            STAGING_R2_PREFLIGHT_VIDEO_URL
          )
          missing=()
          for key in "${required[@]}"; do
            value="${!key}"
            if [ -z "$value" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            mkdir -p artifacts
            printf '{"target":"staging","status":"skipped","reason":"missing GitHub staging secrets","missing":"%s"}\n' "$(IFS=,; echo "${missing[*]}")" > artifacts/staging-provider-canary.json
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Staging provider canary skipped until the documented GitHub environment secrets are configured."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
        env:
          STAGING_STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STAGING_STRIPE_PRICE_PERSONALIZED_OUTREACH: ${{ secrets.STAGING_STRIPE_PRICE_PERSONALIZED_OUTREACH }}
          STAGING_STRIPE_PRICE_AI_VIDEO_AD: ${{ secrets.STAGING_STRIPE_PRICE_AI_VIDEO_AD }}
          STAGING_STRIPE_PRICE_UPLOADED_VIDEO: ${{ secrets.STAGING_STRIPE_PRICE_UPLOADED_VIDEO }}
          STAGING_STRIPE_PRICE_VIDEO_ADDON: ${{ secrets.STAGING_STRIPE_PRICE_VIDEO_ADDON }}
          STAGING_UNIPILE_DSN: ${{ secrets.STAGING_UNIPILE_DSN }}
          STAGING_UNIPILE_API_KEY: ${{ secrets.STAGING_UNIPILE_API_KEY }}
          STAGING_R2_PREFLIGHT_VIDEO_URL: ${{ secrets.STAGING_R2_PREFLIGHT_VIDEO_URL }}

      - uses: pnpm/action-setup@v4
        if: steps.configuration.outputs.configured == 'true'
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        if: steps.configuration.outputs.configured == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.configuration.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run one shared staging provider check
        if: steps.configuration.outputs.configured == 'true'
        run: pnpm --filter @leadreacher/api preflight:staging
      - name: Archive provider readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-provider-canary-${{ github.run_id }}
          path: artifacts/staging-provider-canary.json
          if-no-files-found: warn
