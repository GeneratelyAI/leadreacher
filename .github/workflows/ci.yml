name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: "3001"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leadreacher
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leadreacher
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_API_URL: http://localhost:3001
      UNIPILE_DSN: example.unipile.com
      UNIPILE_API_KEY: test-unipile-key
      UNIPILE_WEBHOOK_SECRET: test-unipile-webhook-secret
      APIFY_API_KEY: test-apify-key
      UPSTASH_REDIS_URL: redis://localhost:6379
      UPSTASH_REDIS_TOKEN: test-redis-token
      GROQ_API_KEY: test-groq-key
      STRIPE_MOCK_MODE: "true"
      VIDEO_MOCK_MODE: "true"
      CI_DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/api prisma validate
      - run: pnpm --dir apps/api prisma generate
      - run: pnpm --dir apps/api lint
      - run: pnpm --dir apps/api test
      - run: pnpm --dir apps/api build
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web exec tsc --noEmit
      - run: pnpm --filter @leadreacher/web build
      - name: Check migration drift
        if: ${{ env.CI_DIRECT_URL != '' }}
        env:
          DIRECT_URL: ${{ env.CI_DIRECT_URL }}
          DATABASE_URL: ${{ env.CI_DIRECT_URL }}
        run: pnpm --dir apps/api prisma migrate status
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
