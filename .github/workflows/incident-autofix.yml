name: Incident autofix

on:
  repository_dispatch:
    types: [incident_autofix]

concurrency:
  group: incident-autofix-${{ github.event.client_payload.repairId }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leadreacher
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d leadreacher"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PORT: "3001"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leadreacher
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leadreacher
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      UNIPILE_DSN: example.unipile.com
      UNIPILE_API_KEY: test-unipile-key
      UNIPILE_WEBHOOK_SECRET: test-unipile-webhook-secret
      REDIS_URL: redis://localhost:6379
      GROQ_API_KEY: test-groq-key
      STRIPE_MOCK_MODE: "true"
      VIDEO_MOCK_MODE: "true"
      INCIDENT_REPAIR_ID: ${{ github.event.client_payload.repairId }}
      INCIDENT_CONTEXT_DIGEST: ${{ github.event.client_payload.contextDigest }}
    steps:
      - name: Validate dispatch envelope
        shell: bash
        run: |
          if [[ ! "$INCIDENT_REPAIR_ID" =~ ^c[a-zA-Z0-9]{8,40}$ ]]; then
            echo "Invalid repair id" >&2
            exit 1
          fi
          if [[ ! "$INCIDENT_CONTEXT_DIGEST" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "Invalid context digest" >&2
            exit 1
          fi

      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch sanitized incident context
        env:
          INCIDENT_AUTOFIX_API_BASE_URL: ${{ secrets.INCIDENT_AUTOFIX_API_BASE_URL }}
          INCIDENT_AUTOFIX_CALLBACK_SECRET: ${{ secrets.INCIDENT_AUTOFIX_CALLBACK_SECRET }}
        run: pnpm --dir apps/api exec tsx src/scripts/fetch-incident-autofix-context.ts

      - name: Capture trusted rollout policy
        id: rollout
        shell: bash
        run: |
          echo "dry_run=$(jq -r '.dryRun' artifacts/incident-context.json)" >> "$GITHUB_OUTPUT"
          echo "auto_merge=$(jq -r '.autoMerge' artifacts/incident-context.json)" >> "$GITHUB_OUTPUT"

      - name: Mark repair active
        env:
          INCIDENT_AUTOFIX_API_BASE_URL: ${{ secrets.INCIDENT_AUTOFIX_API_BASE_URL }}
          INCIDENT_AUTOFIX_CALLBACK_SECRET: ${{ secrets.INCIDENT_AUTOFIX_CALLBACK_SECRET }}
          INCIDENT_CALLBACK_PAYLOAD: >-
            {"status":"repairing","eventType":"codex_started","workflowRunId":"${{ github.run_id }}","workflowRunUrl":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        run: pnpm --dir apps/api exec tsx src/scripts/report-incident-autofix.ts

      - name: Run sandboxed Codex repair
        id: codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/incident-autofix-prompt.md
          output-file: artifacts/codex-final.json
          output-schema-file: .github/incident-autofix-output-schema.json
          working-directory: .
          permission-profile: :workspace
          safety-strategy: drop-sudo

      - name: Generate Prisma client
        run: pnpm --dir apps/api exec prisma generate

      - name: Enforce repair policy
        id: policy
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { appendFileSync, mkdirSync, writeFileSync } = require("node:fs");
          const output = (args) => execFileSync("git", args).toString("utf8");
          const names = output(["diff", "--name-status", "-z", "origin/develop"])
            .split("\0").filter(Boolean);
          const files = [];
          const deletedFiles = [];
          for (let index = 0; index < names.length;) {
            const status = names[index++];
            const oldPath = names[index++];
            if (!oldPath) break;
            const file = /^[RC]/.test(status) ? names[index++] : oldPath;
            if (!file) break;
            files.push(file);
            if (status.startsWith("D")) deletedFiles.push(file);
          }
          let additions = 0;
          let deletions = 0;
          const stats = output(["diff", "--numstat", "-z", "origin/develop"])
            .split("\0").filter(Boolean);
          for (const stat of stats) {
            const [added, deleted] = stat.split("\t");
            if (/^\d+$/.test(added)) additions += Number(added);
            if (/^\d+$/.test(deleted)) deletions += Number(deleted);
          }
          const prohibitedPrefixes = [
            "apps/api/prisma/", ".github/", "infra/", "railway",
            "apps/api/src/routes/stripe", "apps/api/src/modules/billing",
            "apps/api/src/plugins/auth", "apps/api/src/routes/auth",
            "apps/api/src/lib/encryption",
          ];
          const prohibitedFiles = new Set([
            "pnpm-lock.yaml", "package.json", "apps/api/package.json", "apps/web/package.json",
          ]);
          const prohibitedPath = files.find((file) =>
            prohibitedFiles.has(file) || prohibitedPrefixes.some((prefix) => file.startsWith(prefix)));
          const hasRegressionTest = files.some((file) =>
            /(?:^|\/)(?:__tests__\/.*|.*\.(?:test|spec)\.[cm]?[jt]sx?)$/.test(file));
          const reasons = [];
          if (prohibitedPath) reasons.push(`Prohibited path: ${prohibitedPath}`);
          if (deletedFiles.length) reasons.push("File deletion is not allowed");
          if (files.length > 8) reasons.push("More than 8 files changed");
          if (additions + deletions > 350) reasons.push("More than 350 lines changed");
          if (!hasRegressionTest) reasons.push("No regression test was added or updated");
          if (!files.length) throw new Error("Codex produced no changes");
          const risk = prohibitedPath || deletedFiles.length ? "prohibited" : reasons.length ? "high" : "low";
          const decision = { risk, autoMergeAllowed: risk === "low", reasons };
          mkdirSync("artifacts", { recursive: true });
          writeFileSync("artifacts/incident-policy.json", JSON.stringify({
            summary: { files, additions, deletions, deletedFiles, hasRegressionTest }, decision,
          }, null, 2));
          appendFileSync(process.env.GITHUB_OUTPUT, `risk=${risk}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `auto_merge_allowed=${risk === "low"}\n`);
          NODE

      - name: Stop prohibited repair
        if: ${{ steps.policy.outputs.risk == 'prohibited' }}
        env:
          INCIDENT_AUTOFIX_API_BASE_URL: ${{ secrets.INCIDENT_AUTOFIX_API_BASE_URL }}
          INCIDENT_AUTOFIX_CALLBACK_SECRET: ${{ secrets.INCIDENT_AUTOFIX_CALLBACK_SECRET }}
          INCIDENT_CALLBACK_PAYLOAD: >-
            {"status":"blocked","risk":"prohibited","eventType":"policy_blocked","summary":"Repair touched a prohibited path or deleted a file."}
        run: |
          pnpm --dir apps/api exec tsx src/scripts/report-incident-autofix.ts
          exit 1

      - name: Validate repair
        run: |
          pnpm --dir apps/api run lint
          pnpm --dir apps/api run test
          pnpm --dir apps/web run lint
          pnpm --dir apps/web run test

      - name: Commit repair branch
        id: commit
        env:
          GH_TOKEN: ${{ secrets.INCIDENT_AUTOFIX_GITHUB_TOKEN }}
        shell: bash
        run: |
          branch="autofix/incident-${INCIDENT_REPAIR_ID}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "LeadReacher Incident Autofix"
          git config user.email "incident-autofix@users.noreply.github.com"
          git add --all -- . ':(exclude)artifacts/**'
          git commit -m "fix: repair incident ${INCIDENT_REPAIR_ID}"
          gh auth setup-git
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open develop pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.INCIDENT_AUTOFIX_GITHUB_TOKEN }}
        shell: bash
        run: |
          gh label create incident-autofix --color 6f42c1 \
            --description "Automated production incident repair" --force
          summary=$(jq -r '.summary // "Automated incident repair"' artifacts/codex-final.json)
          root_cause=$(jq -r '.rootCause // "See repair diff"' artifacts/codex-final.json)
          body_file=$(mktemp)
          {
            echo "## Automated incident repair"
            echo
            echo "$summary"
            echo
            echo "**Suspected root cause:** $root_cause"
            echo
            echo "**Risk:** ${{ steps.policy.outputs.risk }}"
            echo
            echo "<!-- incident-repair-id: ${INCIDENT_REPAIR_ID} -->"
          } > "$body_file"
          pr_url=$(gh pr create --base develop --head "${{ steps.commit.outputs.branch }}" \
            --title "fix: automated repair for incident ${INCIDENT_REPAIR_ID}" \
            --body-file "$body_file" --label "incident-autofix")
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "number=${pr_url##*/}" >> "$GITHUB_OUTPUT"

      - name: Report pull request
        env:
          INCIDENT_AUTOFIX_API_BASE_URL: ${{ secrets.INCIDENT_AUTOFIX_API_BASE_URL }}
          INCIDENT_AUTOFIX_CALLBACK_SECRET: ${{ secrets.INCIDENT_AUTOFIX_CALLBACK_SECRET }}
          INCIDENT_CALLBACK_PAYLOAD: >-
            {"status":"${{ steps.policy.outputs.risk == 'low' && 'pull_request_open' || 'needs_approval' }}","risk":"${{ steps.policy.outputs.risk }}","eventType":"pull_request_opened","branchName":"${{ steps.commit.outputs.branch }}","commitSha":"${{ steps.commit.outputs.sha }}","pullRequestNumber":${{ steps.pr.outputs.number }},"pullRequestUrl":"${{ steps.pr.outputs.url }}","workflowRunId":"${{ github.run_id }}","workflowRunUrl":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        run: pnpm --dir apps/api exec tsx src/scripts/report-incident-autofix.ts

      - name: Enable policy-gated auto-merge
        if: ${{ steps.policy.outputs.auto_merge_allowed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.INCIDENT_AUTOFIX_GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "${{ steps.rollout.outputs.dry_run }}" == "false" && \
                "${{ steps.rollout.outputs.auto_merge }}" == "true" ]]; then
            gh pr merge "${{ steps.pr.outputs.number }}" --auto --squash
          fi

      - name: Report workflow failure
        if: ${{ failure() && steps.policy.outputs.risk != 'prohibited' }}
        env:
          INCIDENT_AUTOFIX_API_BASE_URL: ${{ secrets.INCIDENT_AUTOFIX_API_BASE_URL }}
          INCIDENT_AUTOFIX_CALLBACK_SECRET: ${{ secrets.INCIDENT_AUTOFIX_CALLBACK_SECRET }}
          INCIDENT_CALLBACK_PAYLOAD: >-
            {"status":"failed","eventType":"workflow_failed","lastError":"Automated repair workflow failed. Review GitHub Actions run ${{ github.run_id }}.","workflowRunId":"${{ github.run_id }}","workflowRunUrl":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        run: pnpm --dir apps/api exec tsx src/scripts/report-incident-autofix.ts
