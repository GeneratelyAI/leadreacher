name: Deployment smoke

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment to verify
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: deployment-smoke-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    env:
      TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
      STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
      STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
      PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
      PRODUCTION_WEB_URL: ${{ secrets.PRODUCTION_WEB_URL }}
    steps:
      - name: Require configured deployment URLs
        shell: bash
        run: |
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            api_url="$PRODUCTION_API_URL"
            web_url="$PRODUCTION_WEB_URL"
          else
            api_url="$STAGING_API_URL"
            web_url="$STAGING_WEB_URL"
          fi

          if [ -z "$api_url" ] || [ -z "$web_url" ]; then
            echo "::error::Deployment smoke requires both API and web URL secrets for $TARGET_ENVIRONMENT."
            exit 1
          fi
          if [[ "$api_url" != https://* ]] || [[ "$web_url" != https://* ]]; then
            echo "::error::Deployment smoke URLs must use HTTPS."
            exit 1
          fi

          echo "API_URL=${api_url%/}" >> "$GITHUB_ENV"
          echo "WEB_URL=${web_url%/}" >> "$GITHUB_ENV"

      - name: Wait for API readiness
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$API_URL/ready" >/dev/null; then
              exit 0
            fi
            echo "API is not ready yet (attempt $attempt/30)."
            sleep 10
          done
          echo "API readiness did not recover within five minutes." >&2
          exit 1

      - name: Verify API liveness
        run: curl --fail --silent --show-error --max-time 10 "$API_URL/health" >/dev/null

      - name: Verify web application
        run: curl --fail --silent --show-error --max-time 10 "$WEB_URL/" >/dev/null
