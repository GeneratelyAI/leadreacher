[build]
# This config is shared by production services rooted at apps/api and staging
# services rooted at the monorepo. Resolve the package directory at runtime so
# both layouts build the same API artifact.
buildCommand = "if [ -f apps/api/package.json ]; then cd apps/api; fi; npm run build"

[deploy]
startCommand = "if [ -f apps/api/dist/index.js ]; then node apps/api/dist/index.js; else node dist/index.js; fi"
preDeployCommand = "if [ -f apps/api/prisma/schema.prisma ]; then cd apps/api; fi; npx prisma migrate deploy"
# Deployment health must not depend on a separately deployed worker publishing
# leases. CI and release smoke use /ready as the strict dependency gate.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
