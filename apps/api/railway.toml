[build]
# Railway builds this service from /apps/api, outside the pnpm workspace root.
buildCommand = "npm run build"

[deploy]
startCommand = "node dist/index.js"
preDeployCommand = "npx prisma migrate deploy"
# Deployment health must not depend on a separately deployed worker publishing
# leases. CI and release smoke use /ready as the strict dependency gate.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
